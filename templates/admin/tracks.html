{% extends 'base.html' %}
{% load static %}
{% load user_tags %}
{% block body %}
<section class="content-container contentContainer" id="homeSection">
    <div class="d-flex justify-content-between align-items-center pb-1 ">
        <h3 class="page-title">Tracks</h3>
        <div class="d-flex gap-1">
            <button type="button" class="btn btn-primary btn-sm d-inline-flex align-items-center" id="addTrackBtn" style="white-space:nowrap;">
                <span>+ Add Track</span>
            </button>
        </div>
    </div>
    <div class="box-container">
        <div class="table-responsive">
            <table id="tracksTable" class="table table-bordered nowrap" style="width:100%">
                <thead>
                    <tr>
                        <th>S.No</th>
                        <th>Name</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for t in tracks %}
                    <tr>
                        <td>{{ forloop.counter }}</td>
                        <td>{{ t.name }}</td>
                        <td>
                            <div class="form-check form-switch">
                                <input class="form-check-input toggle_status" type="checkbox" role="switch"
                                       data-value="{{ t.enc_id }}" {% if t.status %}checked{% endif %}>
                            </div>
                        </td>
                        <td>
                            <a href="javascript:void(0);" class="edit_track" title="Edit"
                               data-id="{{ t.enc_id }}" data-name="{{ t.name }}">
                                <i class="bx bx-edit-alt" style="color:#007367;font-size:18px;"></i>
                            </a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</section>

<div class="modal fade" id="trackModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="trackModalTitle">Add Track</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="trackId">
                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input type="text" class="form-control" id="trackName">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="saveTrackBtn">Save</button>
            </div>
        </div>
    </div>
</div>

<script>
$(document).ready(function () {
    $('#tracksTable').DataTable();

    $('#addTrackBtn').on('click', function () {
        $('#trackModalTitle').text('Add Track');
        $('#trackId').val('');
        $('#trackName').val('');
        $('#trackModal').modal('show');
    });

    $(document.body).on('click', '.edit_track', function () {
        $('#trackModalTitle').text('Edit Track');
        $('#trackId').val($(this).data('id'));
        $('#trackName').val($(this).data('name'));
        $('#trackModal').modal('show');
    });

    $('#saveTrackBtn').on('click', function () {
        var name = $('#trackName').val().trim();
        if (!name) {
            Swal.fire({ title: 'Error', text: 'Name is required.', icon: 'error' });
            return;
        }
        $.ajax({
            type: 'POST',
            url: '/user/admin/tracks/save',
            data: {
                id: $('#trackId').val(),
                name: name
            },
            success: function (response) {
                if (response.status === 200) {
                    $('#trackModal').modal('hide');
                    location.reload();
                } else {
                    Swal.fire({ title: 'Error', text: response.message || 'Could not save track.', icon: 'error' });
                }
            },
            error: function () {
                Swal.fire({ title: 'Error', text: 'Could not save track. Please try again.', icon: 'error' });
            }
        });
    });

    $(document.body).on('change', '.toggle_status', function () {
        var checkbox = $(this);
        $.ajax({
            type: 'POST',
            url: '/user/admin/tracks/toggle_status',
            data: { id: checkbox.data('value') },
            success: function (response) {
                if (response.status !== 200) {
                    checkbox.prop('checked', !checkbox.prop('checked'));
                    Swal.fire({ title: 'Error', text: response.message || 'Could not update status.', icon: 'error' });
                }
            },
            error: function () {
                checkbox.prop('checked', !checkbox.prop('checked'));
                Swal.fire({ title: 'Error', text: 'Could not update status. Please try again.', icon: 'error' });
            }
        });
    });
});
</script>

{% endblock %}
