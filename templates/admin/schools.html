{% extends 'base.html' %}
{% load static %}
{% load user_tags %}
{% block body %}
<section class="content-container contentContainer" id="homeSection">
    <div class="d-flex justify-content-between align-items-center pb-1 ">
        <h3 class="page-title">Schools</h3>
        <div class="d-flex gap-1">
            <button type="button" class="btn btn-primary btn-sm d-inline-flex align-items-center" id="addSchoolBtn" style="white-space:nowrap;">
                <span>+ Add School</span>
            </button>
        </div>
    </div>
    <div class="box-container">
        <div class="table-responsive">
            <table id="schoolsTable" class="table table-bordered nowrap" style="width:100%">
                <thead>
                    <tr>
                        <th>S.No</th>
                        <th>Name</th>
                        <th>Code</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for s in schools %}
                    <tr>
                        <td>{{ forloop.counter }}</td>
                        <td>{{ s.name }}</td>
                        <td>{{ s.code|default:"—" }}</td>
                        <td>
                            <div class="form-check form-switch">
                                <input class="form-check-input toggle_status" type="checkbox" role="switch"
                                       data-value="{{ s.enc_id }}" {% if s.status %}checked{% endif %}>
                            </div>
                        </td>
                        <td>
                            <a href="javascript:void(0);" class="edit_school" title="Edit"
                               data-id="{{ s.enc_id }}" data-name="{{ s.name }}" data-code="{{ s.code|default:'' }}">
                                <i class="bx bx-edit-alt" style="color:#007367;font-size:18px;"></i>
                            </a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</section>

<div class="modal fade" id="schoolModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="schoolModalTitle">Add School</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="schoolId">
                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input type="text" class="form-control" id="schoolName">
                </div>
                <div class="mb-3">
                    <label class="form-label">Code</label>
                    <input type="text" class="form-control" id="schoolCode">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="saveSchoolBtn">Save</button>
            </div>
        </div>
    </div>
</div>

<script>
$(document).ready(function () {
    $('#schoolsTable').DataTable();

    $('#addSchoolBtn').on('click', function () {
        $('#schoolModalTitle').text('Add School');
        $('#schoolId').val('');
        $('#schoolName').val('');
        $('#schoolCode').val('');
        $('#schoolModal').modal('show');
    });

    $(document.body).on('click', '.edit_school', function () {
        $('#schoolModalTitle').text('Edit School');
        $('#schoolId').val($(this).data('id'));
        $('#schoolName').val($(this).data('name'));
        $('#schoolCode').val($(this).data('code'));
        $('#schoolModal').modal('show');
    });

    $('#saveSchoolBtn').on('click', function () {
        var name = $('#schoolName').val().trim();
        if (!name) {
            Swal.fire({ title: 'Error', text: 'Name is required.', icon: 'error' });
            return;
        }
        $.ajax({
            type: 'POST',
            url: '/user/admin/schools/save',
            data: {
                id: $('#schoolId').val(),
                name: name,
                code: $('#schoolCode').val().trim()
            },
            success: function (response) {
                if (response.status === 200) {
                    $('#schoolModal').modal('hide');
                    location.reload();
                } else {
                    Swal.fire({ title: 'Error', text: response.message || 'Could not save school.', icon: 'error' });
                }
            },
            error: function () {
                Swal.fire({ title: 'Error', text: 'Could not save school. Please try again.', icon: 'error' });
            }
        });
    });

    $(document.body).on('change', '.toggle_status', function () {
        var checkbox = $(this);
        $.ajax({
            type: 'POST',
            url: '/user/admin/schools/toggle_status',
            data: { id: checkbox.data('value') },
            success: function (response) {
                if (response.status !== 200) {
                    checkbox.prop('checked', !checkbox.prop('checked'));
                    Swal.fire({ title: 'Error', text: response.message || 'Could not update status.', icon: 'error' });
                }
            },
            error: function () {
                checkbox.prop('checked', !checkbox.prop('checked'));
                Swal.fire({ title: 'Error', text: 'Could not update status. Please try again.', icon: 'error' });
            }
        });
    });
});
</script>

{% endblock %}
